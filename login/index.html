<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login SQLi Demo</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        max-width: 860px;
        margin: 55px auto;
        padding: 0 24px;
        color: #20334b;
        background: #f5f7fa;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 520px;
        padding: 25px;
        background: white;
        border: 1px solid #d6e0eb;
        border-radius: 8px;
      }
      input,
      button {
        padding: 10px;
        font-size: 16px;
      }
      #out {
        margin-top: 20px;
        white-space: pre-wrap;
        font-size: 17px;
        line-height: 1.5;
      }
      label { font-weight: 600; }
      #version { color: #087f8c; font-weight: 700; }
      #http { font-weight: 700; margin-top: 20px; }
      h1 { font-size: 25px; }
    </style>
  </head>
  <body>
    <h1>Login: laboratorio de SQL injection</h1>
    <p id="version"></p>
    <p>Pruebas locales con cuentas de demostración. Contraseña visible para documentar los payloads.</p>
    <form id="loginForm">
      <label for="username">Usuario</label>
      <input id="username" placeholder="Usuario" required />
      <label for="password">Contraseña</label>
      <input id="password" type="text" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>
    <div id="http" role="status"></div>
    <pre id="out"></pre>

    <script>
      document.getElementById('version').textContent = location.port === '3001'
        ? 'ANTES | consulta original por concatenación | puerto 3001'
        : 'DESPUÉS | consulta corregida con parámetros | puerto ' + location.port;
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          const res = await fetch("/login-vulnerable", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();
          document.getElementById('http').textContent = 'POST /login-vulnerable - HTTP ' + res.status;
          document.getElementById("out").textContent = JSON.stringify(
            data,
            null,
            2,
          );
        });
    </script>
  </body>
</html>
