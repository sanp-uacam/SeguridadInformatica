<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login SQLi corregido</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#17212b}main{max-width:520px;margin:70px auto;background:white;padding:32px;border:1px solid #d9dfe6;border-radius:8px}h1{font-size:26px;margin-top:0}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:12px;font-size:16px;margin-top:7px}input{border:1px solid #9ca8b5;border-radius:4px}button{background:#245da8;color:white;border:0;border-radius:4px;margin-top:22px;cursor:pointer}#out{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f6;padding:16px;min-height:60px}#status{font-weight:bold;min-height:20px;margin-top:22px}</style></head>
<body><main><h1>Inicio de sesión</h1><p>Validación de credenciales</p><form id="loginForm"><label for="username">Usuario</label><input id="username" autocomplete="username" maxlength="100" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" maxlength="100" required><button type="submit">Entrar</button></form><p id="status" role="status"></p><pre id="out" aria-live="polite"></pre></main>
<script>document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('status');const output=document.getElementById('out');try{const response=await fetch('/login-vulnerable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();status.textContent=`HTTP ${response.status} · ${data.ok?'Acceso permitido':'Solicitud rechazada'}`;output.textContent=JSON.stringify(data,null,2);}catch{status.textContent='No se pudo conectar con el servidor.';output.textContent='Intenta de nuevo.';}});</script></body></html>
